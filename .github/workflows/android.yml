
name: Build Hesabeman APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hesabeman_github_build.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir source
          unzip -q hesabeman_github_build.zip -d source

      - name: Find and build Android project
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabeman-APK
          path: source/**/build/outputs/apk/debug/*.apk
